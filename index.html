<script>
// Mascot Controller - "Der Stift"
const Mascot = (() => {
  let el = null;
  let hideTimeout = null;
  let tapCount = 0;
  let tapTimer = null;

  function createSVG(state) {
    return `
      <svg class="mascot ${state}" data-state="${state}" viewBox="0 0 120 120" width="80" height="80" aria-hidden="true">
        <defs>
          <style>
            .body { fill: #F0B429; }
            .body-dark { fill: #D4A024; }
            .eraser { fill: #C0392B; }
            .face { fill: #23324D; }
            .cheek { fill: #F0B429; opacity: 0.6; }
            .highlight { fill: #FFF; opacity: 0.3; }
            .shadow { fill: #000; opacity: 0.1; }
          </style>
        </defs>
        <ellipse cx="60" cy="112" rx="35" ry="6" class="shadow"/>
        <path d="M60 10 L35 95 Q30 100 60 100 Q90 100 85 95 L60 10Z" class="body"/>
        <path d="M60 10 L35 95 Q30 100 60 100" class="body-dark" fill-opacity="0.2"/>
        <rect x="38" y="95" width="44" height="8" rx="2" fill="#8B8B8B"/>
        <rect x="40" y="96" width="40" height="4" rx="1" fill="#B0B0B0"/>
        <rect x="42" y="88" width="36" height="8" rx="3" class="eraser"/>
        <g stroke="#D4A024" stroke-width="0.5" stroke-opacity="0.5" fill="none">
          <line x1="42" y1="15" x2="42" y2="88"/>
          <line x1="50" y1="12" x2="50" y2="88"/>
          <line x1="60" y1="10" x2="60" y2="88"/>
          <line x1="70" y1="12" x2="70" y2="88"/>
          <line x1="78" y1="15" x2="78" y2="88"/>
        </g>
        <path d="M42 15 L42 88" class="highlight" stroke-width="2" fill="none"/>
        <ellipse cx="50" cy="45" rx="6" ry="8" class="face"/>
        <ellipse cx="48" cy="43" rx="2.5" ry="3" class="highlight"/>
        <ellipse cx="70" cy="45" rx="6" ry="8" class="face"/>
        <ellipse cx="68" cy="43" rx="2.5" ry="3" class="highlight"/>
        <ellipse cx="42" cy="55" rx="5" ry="3" class="cheek"/>
        <ellipse cx="78" cy="55" rx="5" ry="3" class="cheek"/>
        ${getMouth(state)}
        ${getStateExtras(state)}
      </svg>
    `;
  }

  function getMouth(state) {
    switch (state) {
      case 'correct': return '<path d="M45 65 Q60 80 75 65" stroke="#2F7A45" stroke-width="3" fill="none" stroke-linecap="round"/>';
      case 'wrong': return '<path d="M50 65 Q60 58 70 65" stroke="#C0392B" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M45 50 Q43 58 45 62 Q47 60 45 50" fill="#3498DB" opacity="0.8"/><rect x="56" y="12" width="16" height="8" rx="2" fill="#FFE4E1" stroke="#C0392B" stroke-width="1"/><rect x="62" y="14" width="4" height="4" fill="#C0392B"/>';
      case 'streak': return '<path d="M48 65 Q60 82 72 65" stroke="#F0B429" stroke-width="3" fill="none" stroke-linecap="round"/>';
      case 'perfect': return '<path d="M45 65 Q60 85 75 65" stroke="#F0B429" stroke-width="3" fill="none" stroke-linecap="round"/>';
      case 'tickle': return '<ellipse cx="60" cy="68" rx="9" ry="8" fill="#23324D"/><path d="M52 66 Q60 58 68 66" fill="#F0B429" stroke="none"/><path d="M53 62 Q60 56 67 62" fill="#FFF" opacity="0.35" stroke="none"/>';
      case 'run': return '<ellipse cx="60" cy="66" rx="10" ry="9" fill="#23324D"/><path d="M51 64 Q60 54 69 64" fill="#F0B429" stroke="none"/><path d="M52 60 Q60 52 68 60" fill="#FFF" opacity="0.35" stroke="none"/><path d="M50 70 Q60 78 70 70" stroke="#FFF" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>';
      default: return '<path d="M50 65 Q60 75 70 65" stroke="#23324D" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
    }
  }

  function getStateExtras(state) {
    switch (state) {
      case 'correct': return '<g fill="#2F7A45"><polygon points="30,25 32,30 27,30 31,33 26,33 30,38 34,33 29,33 33,30 28,30"/><polygon points="90,30 92,35 87,35 91,38 86,38 90,43 94,38 89,38 93,35 88,35" transform="scale(0.7)"/><polygon points="55,85 57,90 52,90 56,93 51,93 55,98 59,93 54,93 58,90 53,90" transform="scale(0.6)"/></g>';
      case 'streak': return '<g fill="#F0B429"><path d="M25 40 Q22 30 28 25 Q34 30 25 40" opacity="0.9"/><path d="M90 35 Q87 25 93 20 Q99 25 90 35" opacity="0.7" transform="scale(0.8)"/><path d="M40 85 Q37 75 43 70 Q49 75 40 85" opacity="0.6" transform="scale(0.7)"/></g>';
      case 'perfect': return '<g fill="#F0B429"><polygon points="30,20 32,25 27,25 31,28 26,28 30,33 34,28 29,28 33,25 28,25"/><polygon points="90,25 92,30 87,30 91,33 86,33 90,38 94,33 89,33 93,30 88,30" transform="scale(0.7)"/><polygon points="55,80 57,85 52,85 56,88 51,88 55,93 59,88 54,88 58,85 53,85" transform="scale(0.6)"/></g>';
      case 'tickle': return '<path d="M44 45 Q50 38 56 45" stroke="#23324D" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M64 45 Q70 38 76 45" stroke="#23324D" stroke-width="2.5" fill="none" stroke-linecap="round"/><g stroke="#F0B429" stroke-width="2.5" stroke-linecap="round" opacity="0.8"><path d="M20 25 L10 15"/><path d="M28 18 L22 8"/><path d="M100 25 L110 15"/><path d="M92 18 L98 8"/></g>';
      case 'run': return '<path d="M44 44 Q50 37 56 44" stroke="#23324D" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M64 44 Q70 37 76 44" stroke="#23324D" stroke-width="2.5" fill="none" stroke-linecap="round"/><g fill="#23324D"><path d="M37 100 Q35 109 43 109 L45 101 Z"/><path d="M77 100 Q79 109 71 109 L69 101 Z"/></g><g stroke="#F0B429" stroke-width="3" stroke-linecap="round" opacity="0.85"><path d="M12 44 L0 40"/><path d="M16 58 L2 58"/><path d="M14 72 L4 76"/></g>';
      default: return '';
    }
  }

  function init() {
    if (el) return el;

    el = document.createElement('button');
    el.type = 'button';
    el.className = 'mascot-container';
    el.setAttribute('aria-label', 'Play with mascot');
    el.title = 'Play with mascot';
    el.innerHTML = createSVG('idle');

    document.body.appendChild(el);

    if (!document.getElementById('mascot-styles')) {
      const style = document.createElement('style');
      style.id = 'mascot-styles';
      style.textContent = `
        .mascot-container { position: fixed; bottom: 20px; right: 20px; z-index: 5; width: 80px; height: 80px; padding: 0; border: 0; background: transparent; cursor: pointer; }
        .mascot-container:focus-visible { outline: 2px solid var(--redline); outline-offset: 3px; border-radius: 8px; }
        .mascot { width: 80px; height: 80px; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15)); pointer-events: none; }
        .mascot.correct { animation: mascot-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .mascot.streak { animation: mascot-pulse 0.8s ease-in-out; }
        .mascot.perfect { animation: mascot-spin 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .mascot.tickle { animation: mascot-tickle 0.7s ease-in-out; }
        .mascot.idle { animation: mascot-breathe 3s ease-in-out infinite; }
        @keyframes mascot-bounce { 0%,100%{transform:translateY(0)scale(1);}30%{transform:translateY(-15px)scale(1.1);}50%{transform:translateY(-5px)scale(1.05);} }
        @keyframes mascot-pulse { 0%,100%{transform:scale(1);}50%{transform:scale(1.1);} }
        @keyframes mascot-spin { 0%{transform:rotate(0)scale(1);}50%{transform:rotate(180deg)scale(1.2);}100%{transform:rotate(360deg)scale(1);} }
        @keyframes mascot-tickle { 0%,100%{transform:translateX(0)rotate(0);}15%{transform:translateX(-7px)rotate(-10deg);}30%{transform:translateX(7px)rotate(10deg);}45%{transform:translateX(-6px)rotate(-8deg);}60%{transform:translateX(6px)rotate(8deg);}75%{transform:translateX(-4px)rotate(-5deg);}90%{transform:translateX(4px)rotate(5deg);} }
        @keyframes mascot-breathe { 0%,100%{transform:translateY(0)scale(1);}50%{transform:translateY(-3px)scale(1.02);} }
        .mascot-giggle { position: absolute; top: -18px; right: 6px; font-family: var(--font-hand, "Kalam", cursive); font-size: 15px; font-weight: 700; color: #C0392B; pointer-events: none; animation: giggle-rise 1.1s ease-out forwards; white-space: nowrap; }
        @keyframes giggle-rise { 0%{opacity:0; transform:translateY(8px) scale(0.6);} 20%{opacity:1; transform:translateY(0) scale(1.1);} 100%{opacity:0; transform:translateY(-34px) scale(1);} }
        .mascot.run { animation: mascot-run-svg 0.4s ease-in-out infinite alternate; }
        .mascot-container.running { animation: mascot-run-across 5.5s linear forwards; }
        @keyframes mascot-run-svg { 0%{transform:translateX(0)rotate(-6deg)scale(1.05);} 100%{transform:translateX(4px)rotate(6deg)scale(1.02);} }
        @keyframes mascot-run-across {
          0% { transform: translateX(0) rotate(0deg) scale(1); }
          5% { transform: translateX(-14vw) rotate(-14deg) scale(1.08); }
          10% { transform: translateX(-29vw) rotate(12deg) scale(1.08); }
          15% { transform: translateX(-43vw) rotate(-14deg) scale(1.12); }
          20% { transform: translateX(-57vw) rotate(12deg) scale(1.12); }
          25% { transform: translateX(-71vw) rotate(-14deg) scale(1.15); }
          30% { transform: translateX(-86vw) rotate(12deg) scale(1.15); }
          35% { transform: translateX(calc(-100vw + 60px)) rotate(-14deg) scale(1); }
          65% { transform: translateX(calc(-100vw + 60px)) rotate(-14deg) scale(1); }
          70% { transform: translateX(-86vw) rotate(-14deg) scale(1.08); }
          75% { transform: translateX(-71vw) rotate(12deg) scale(1.08); }
          80% { transform: translateX(-57vw) rotate(-14deg) scale(1.12); }
          85% { transform: translateX(-43vw) rotate(12deg) scale(1.12); }
          90% { transform: translateX(-29vw) rotate(-14deg) scale(1.15); }
          95% { transform: translateX(-14vw) rotate(12deg) scale(1.15); }
          100% { transform: translateX(0) rotate(0deg) scale(1); }
        }
        @media (prefers-reduced-motion: reduce) { .mascot, .mascot * { animation: none !important; transition: none !important; } }
      `;
      document.head.appendChild(style);
    }

    el.addEventListener('click', () => {
      if (el.classList.contains('running')) return;
      tapCount += 1;
      if (tapTimer) clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
      if (tapCount >= 2) {
        tapCount = 0;
        run();
        return;
      }
      show('tickle');
      const giggle = document.createElement('span');
      giggle.className = 'mascot-giggle';
      const phrases = ['hihi!', 'hehe!', 'kitzel!', 'hehehe!'];
      giggle.textContent = phrases[Math.floor(Math.random() * phrases.length)];
      el.appendChild(giggle);
      setTimeout(() => giggle.remove(), 1200);
    });

    return el;
  }

  function run() {
    if (!el) init();
    const container = el;
    const svg = container.querySelector('.mascot');
    if (svg) svg.outerHTML = createSVG('run');
    container.classList.remove('running');
    void container.offsetWidth;
    container.classList.add('running');
    const shout = document.createElement('span');
    shout.className = 'mascot-giggle';
    shout.textContent = 'wäääh!!';
    container.appendChild(shout);
    setTimeout(() => shout.remove(), 5500);
    if (hideTimeout) clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      container.classList.remove('running');
      show('idle');
    }, 5600);
  }

  function show(state) {
    if (!el) init();

    const svg = el.querySelector('.mascot');
    if (svg) {
      svg.outerHTML = createSVG(state);
    }

    if (hideTimeout) clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      if (state !== 'idle' && state !== 'tickle' && state !== 'run') show('idle');
    }, 2500);
    if (state === 'tickle') {
      hideTimeout = setTimeout(() => show('idle'), 1300);
    }
  }

  return {
    init,
    show,
    hide: () => {},
    correct: () => show('correct'),
    wrong: () => show('wrong'),
    streak: () => show('streak'),
    perfect: () => show('perfect'),
    tickle: () => show('tickle'),
    run,
    idle: () => show('idle')
  };
})();

window.Mascot = Mascot;</script>

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function sample(items) { return items[Math.floor(Math.random() * items.length)]; }

// Balanced bag for answer options: correct appears once at each A/B/C/D per 4 questions
let optionPosBag = [];
let optionPosIdx = 0;
function balancedShuffle(correct, distractors) {
  if (optionPosBag.length === 0 || optionPosIdx >= optionPosBag.length) {
    optionPosBag = shuffle([0, 1, 2, 3]);
    optionPosIdx = 0;
  }
  const pos = optionPosBag[optionPosIdx++];
  const shuffledDistractors = shuffle([...distractors]);
  const result = [...shuffledDistractors];
  result.splice(pos, 0, correct);
  return result;
}
function percent(numerator, denominator) { return denominator ? Math.round((numerator / denominator) * 100) : 0; }
function average(values) { return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0; }
function escapeHtml(value = "") { return String(value).replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]); }
function formatTime(seconds) { const safe = Math.max(0, Math.ceil(seconds)); return `${String(Math.floor(safe / 60)).padStart(2, "0")}:${String(safe % 60).padStart(2, "0")}`; }
function cleanText(value) { return String(value ?? "").replace(/\s+/g, " ").trim(); }
function normalizeVerbKey(verb) { return cleanText(verb).toLocaleLowerCase("de-DE"); }

let germanVoice = null;
let englishVoice = null;
let voiceLoadPromise = null;
let voiceWarmedUp = false;

if ("speechSynthesis" in window) {
  speechSynthesis.addEventListener("voiceschanged", refreshVoices);
}

function pickGermanVoice(voices) {
  if (!voices || !voices.length) return null;
  const de = voices.filter(v => /^de(-DE)?$/i.test(v.lang));
  const femaleNames = /petra|anna|katja|stefanie|conny|female|google deutsch female|ingrid|helga|monika|sabine/i;
  return de.find(v => femaleNames.test(v.name))
      || de.find(v => v.localService === true && femaleNames.test(v.name))
      || de.find(v => v.localService === true)
      || de.find(v => /natural|online/i.test(v.name))
      || de.find(v => true)
      || voices.find(v => v.lang && v.lang.toLowerCase().startsWith("de"))
      || null;
}

function pickEnglishVoice(voices) {
  if (!voices || !voices.length) return null;
  const en = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  const femaleNames = /samantha|karen|moira|zira|hazel|victoria|female|google uk english female|susan|alice|catherine|serena|tessa|fiona/i;
  return en.find(v => femaleNames.test(v.name))
      || en.find(v => v.localService === true && femaleNames.test(v.name))
      || en.find(v => v.localService === true)
      || en.find(v => /natural|online/i.test(v.name))
      || en.find(v => true)
      || null;
}

function refreshVoices() {
  if ("speechSynthesis" in window) {
    germanVoice = pickGermanVoice(speechSynthesis.getVoices());
    englishVoice = pickEnglishVoice(speechSynthesis.getVoices());
  }
}

function ensureVoicesLoaded() {
  if (!("speechSynthesis" in window)) return Promise.resolve();
  if (voiceLoadPromise) return voiceLoadPromise;
  refreshVoices();
  voiceLoadPromise = new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    function cleanupAndFinish() {
      clearInterval(poll);
      speechSynthesis.removeEventListener("voiceschanged", onChange);
      refreshVoices();
      finish();
    }
    function hasVoices() { return speechSynthesis.getVoices().length > 0; }
    if (hasVoices()) { refreshVoices(); finish(); return; }
    const onChange = () => {
      refreshVoices();
      if (hasVoices()) cleanupAndFinish();
    };
    const poll = setInterval(() => { if (hasVoices()) cleanupAndFinish(); }, 150);
    speechSynthesis.addEventListener("voiceschanged", onChange);
    setTimeout(cleanupAndFinish, 3000);
  });
  return voiceLoadPromise;
}

function speak(text, options = {}) {
  if (!("speechSynthesis" in window)) return Promise.resolve();
  let cleanText = String(text || "").trim().toLowerCase();
  if (!cleanText) return Promise.resolve();
  cleanText = cleanText.charAt(0).toUpperCase() + cleanText.slice(1);
  if (!/[.!?]$/.test(cleanText)) cleanText += ".";
  const lang = options.lang || "de-DE";
  if (!voiceWarmedUp) {
    voiceWarmedUp = true;
    try {
      const warm = new SpeechSynthesisUtterance(" ");
      warm.volume = 0;
      warm.rate = 10;
      speechSynthesis.speak(warm);
    } catch (e) {}
  }
  return ensureVoicesLoaded().then(() => {
    return new Promise(resolve => {
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = lang;
      if (lang === "de-DE") {
        if (!germanVoice) germanVoice = pickGermanVoice(speechSynthesis.getVoices());
        if (germanVoice) utterance.voice = germanVoice;
      }
      else if (lang !== "de-DE") {
        if (!englishVoice) englishVoice = pickEnglishVoice(speechSynthesis.getVoices());
        if (englishVoice) utterance.voice = englishVoice;
      }
      utterance.rate = options.rate ?? 1.0;
      utterance.pitch = options.pitch ?? 1.0;
      utterance.volume = options.volume ?? 1.0;
      let settled = false;
      const finish = () => { if (!settled) { settled = true; resolve(); } };
      utterance.onend = finish;
      utterance.onerror = finish;
      const startSpeaking = () => {
        try { speechSynthesis.resume(); } catch (e) {}
        speechSynthesis.speak(utterance);
        setTimeout(finish, Math.max(4000, cleanText.length * 200));
      };
      if (speechSynthesis.speaking || speechSynthesis.pending) {
        speechSynthesis.cancel();
        setTimeout(startSpeaking, 250);
      } else {
        startSpeaking();
      }
    });
  });
}

function speakVerb(verb, formKey = "verb") {
  const form = verb[formKey] || verb.verb || verb.ich;
  return speak(form, { rate: 0.9 });
}

function speakWord(word, lang) {
  return speak(word, { rate: 0.95, lang: lang || "de-DE" });
}

function speakSentence(sentence) {
  return speak(sentence, { rate: 0.9 });
}

function stopSpeaking() {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

// ---- iOS-style edge swipe back ----
const swipeBackConfig = {
  edge: 25,
  commitRatio: 0.35,
  minVelocity: 0.55,
  minVelocityDistance: 50,
  maxDragRatio: 0.5,
  cancelDuration: 340,
  cancelEasing: "cubic-bezier(.34,1.25,.44,1)",
  commitDuration: 300,
  commitEasing: "cubic-bezier(.25,.8,.3,1)"
};

let swipeState = null;
let swipeShell = null;

function initEdgeSwipe() {
  swipeShell = document.querySelector(".app-shell");
  const cfg = swipeBackConfig;
  const velocitySamples = [];
  let commitTimer = null;
  const settleShell = (mode) => {
    if (mode === "bounce") swipeShell.style.transition = `transform ${cfg.cancelDuration}ms ${cfg.cancelEasing}`;
    else swipeShell.style.transition = "none";
    swipeShell.style.transform = "none";
    swipeShell.style.willChange = "auto";
    setTimeout(() => { if (mode !== "commit") swipeShell.style.transition = ""; }, cfg.cancelDuration + 60);
  };
  const cancelGesture = () => {
    if (commitTimer) { clearTimeout(commitTimer); commitTimer = null; }
    swipeState = null;
    settleShell("bounce");
  };
  document.addEventListener("pointerdown", event => {
    if (swipeState || !swipeShell || swipeShell.inert) return;
    if (!event.isPrimary) return;
    if (event.pointerType === "touch" ? false : event.pointerType === "mouse" ? !(event.buttons & 1) : true) return;
    if (event.clientX > cfg.edge) return;
    if (event.target.closest("input, textarea, select")) return;
    if (activeScreen === "home" && !activeSession) return;
    velocitySamples.length = 0;
    swipeState = { startX: event.clientX, startY: event.clientY, active: false, startScreen: activeScreen, lastX: event.clientX, lastY: event.clientY, lastTime: event.timeStamp };
  });
  document.addEventListener("pointermove", event => {
    if (!swipeState) return;
    if (activeScreen !== swipeState.startScreen) { cancelGesture(); return; }
    const dx = event.clientX - swipeState.startX;
    const dy = event.clientY - swipeState.startY;
    if (!swipeState.active) {
      if (dx > 14 && Math.abs(dy) < 28) swipeState.active = true;
      else if (Math.abs(dx) <= 14 && Math.abs(dy) > 14) { cancelGesture(); return; }
      else return;
    }
    event.preventDefault();
    velocitySamples.push({ dx: event.clientX - swipeState.lastX, dt: Math.max(1, event.timeStamp - swipeState.lastTime) });
    if (velocitySamples.length > 3) velocitySamples.shift();
    swipeState.lastX = event.clientX;
    swipeState.lastTime = event.timeStamp;
    const offset = Math.max(0, Math.min(dx, swipeShell.clientWidth * cfg.maxDragRatio));
    swipeShell.style.transition = "none";
    swipeShell.style.willChange = "transform";
    swipeShell.style.transform = `translate3d(${offset}px, 0, 0)`;
  });
  document.addEventListener("pointerup", event => {
    if (!swipeState) return;
    const s = swipeState;
    swipeState = null;
    const dx = event.clientX - s.startX;
    const velocity = velocitySamples.reduce((sum, v) => sum + v.dx, 0) / Math.max(1, velocitySamples.reduce((sum, v) => sum + v.dt, 0));
    const commitDistance = window.innerWidth * cfg.commitRatio;
    const committed = s.active && (dx >= commitDistance || (dx >= cfg.minVelocityDistance && velocity >= cfg.minVelocity));
    if (committed) {
      const startScreen = s.startScreen;
      swipeShell.style.transition = `transform ${cfg.commitDuration}ms ${cfg.commitEasing}`;
      swipeShell.style.transform = `translate3d(${Math.round(swipeShell.clientWidth * 0.45)}px, 0, 0)`;
      commitTimer = setTimeout(() => {
        commitTimer = null;
        swipeShell.style.transition = "none";
        swipeShell.style.transform = "none";
        swipeShell.style.willChange = "auto";
        handleSwipeBack(startScreen);
      }, cfg.commitDuration + 30);
    } else {
      settleShell("bounce");
    }
  });
  document.addEventListener("pointercancel", cancelGesture);
  window.addEventListener("resize", () => { if (swipeState) cancelGesture(); });
  window.addEventListener("orientationchange", () => { if (swipeState) cancelGesture(); });
}

async function handleSwipeBack(startScreen) {
  if (startScreen !== activeScreen || swipeShell?.inert) return;
  if (activeSession) {
    await abandonSession("Swipe back to leave the current Übungsmodus. You'll see your results so far.");
    return;
  }
  goBack();
}

function goBack(fallback = backTarget()) {
  const previous = screenHistory.pop();
  if (previous) {
    pendingKind = previous.kind;
    pendingVocabLevel = previous.vocabLevel;
    pendingZahlenRange = previous.zahlenRange;
    if (previous.session) lastSession = previous.session;
    render(previous.screen, false);
  } else {
    render(fallback, false);
  }
}

function backTarget(screen) {
  screen = screen || activeScreen;
  if (screen === "vocab-level-select") return "mode-select";
  if (screen === "b1-glossary" || screen === "a1-glossary" || screen === "a1-chapter-select" || screen === "a2-glossary" || screen === "b1plus-glossary" || screen === "a2-chapter-select" || screen === "b1plus-chapter-select") return "session-type-select";
  if (screen === "session-type-select") {
    if (pendingKind === "vocab") return "vocab-level-select";
    return "mode-select";
  }
  if (screen === "review") return "session-type-select";
  return "home";
}

function createDeck(verbs, progress, count) {
  const keys = new Set(progress.usedVerbKeys || []);
  let available = verbs.filter(verb => !keys.has(keyOf(verb)));
  if (available.length < count) {
    progress.usedVerbKeys = [];
    available = [...verbs];
  }
  const chosen = shuffle(available).slice(0, Math.min(count, available.length));
  progress.usedVerbKeys = [...new Set([...(progress.usedVerbKeys || []), ...chosen.map(keyOf)])];
  return chosen;
}

function createQuestion(verb, overrides = {}, progress = null, allVerbs = null, difficulty = "hard") {
  const recent = progress?.recentQuestions || [];
  let result;
  let attempt = 0;
  do {
    const profile = verb.questionProfile || {};
    const pronoun = profile.subject ? pronounFromProfile(profile) : overrides.pronoun || sample(PRONOUNS);
    const questionType = overrides.questionType || sampleQuestionType(pronoun.id === "du" || pronoun.id === "ihr" ? "statement" : null);
    const correct = normalizeStandardSpelling(verb, cleanText(verb[pronoun.formKey] || verb[pronoun.fallbackFormKey] || verb.er));
    const sentenceData = buildSentence(verb, pronoun, correct, questionType.id, profile);
    result = {
      verb, pronoun, correct,
      options: buildOptions(verb, correct, allVerbs, difficulty),
      sentence: sentenceData.question,
      solutionSentence: sentenceData.solution,
      questionType: questionType.id,
      questionTypeLabel: questionType.label,
      explanation: `${pronoun.label} uses “${correct.toLocaleLowerCase("de-DE")}” — the ${pronoun.description} present-tense form of “${verb.verb}”.`,
      signature: `${verb.verb}|${questionType.id}|${sentenceData.question}`
    };
    attempt += 1;
  } while (progress && recent.includes(result.signature) && attempt < 20);
  if (progress) progress.recentQuestions = [...recent.filter(sig => sig !== result.signature), result.signature].slice(-400);
  return result;
}

function shuffleBagSequence(items, count) {
  const sequence = [];
  while (sequence.length < count) {
    const bag = shuffle([...items]);
    const previousLast = sequence[sequence.length - 1];
    if (previousLast !== undefined && bag[0] === previousLast && bag.length > 1) {
      const swapIndex = 1 + Math.floor(Math.random() * (bag.length - 1));
      [bag[0], bag[swapIndex]] = [bag[swapIndex], bag[0]];
    }
    sequence.push(...bag);
  }
  return sequence.slice(0, count);
}

function createSessionQuestions(verbs, mode, progress = null, allVerbs = null, difficulty = "hard") {
  const pronounSequence = shuffleBagSequence(PRONOUNS, verbs.length);
  return verbs.map((verb, index) => createQuestion(verb, { pronoun: pronounSequence[index] }, progress, allVerbs, difficulty));
}


function sampleQuestionType(excludeId = null) {
  const pool = excludeId ? questionTypes.filter(type => type.id !== excludeId) : questionTypes;
  const roll = Math.random() * pool.reduce((total, type) => total + type.weight, 0);
  let threshold = 0;
  for (const type of pool) {
    threshold += type.weight;
    if (roll < threshold) return type;
  }
  return pool[0];
}

function buildSentence(verb, pronoun, correct, type, profile = {}) {
  const { finite, particle } = splitForm(verb, correct);
  const statementTail = profile.statementTail ?? statementTailFor(verb, particle, pronoun);
  const [wWord, wTail] = profile.wWord
    ? [profile.wWord, profile.wTail ?? ""]
    : wContexts[cleanText(verb.meaning).toLocaleLowerCase("en-US")] || ["Wann", statementTail];
  const subject = pronoun.subject;
  const sentenceSubject = subject.charAt(0).toLocaleUpperCase("de-DE") + subject.slice(1);
  if (type === "w-question") return sentencePair(wWord, finite, subject, wTail, particle, "?");
  if (type === "yes-no") return sentencePair("", finite, subject, statementTail, particle, "?");
  return sentencePair(sentenceSubject, finite, "", statementTail, particle, ".");
}

function sentencePair(prefix, finite, subject, tail, particle, punctuation) {
  const question = capitalizeInitial(assemble(prefix, "___", subject, tail, particle ? "___" : "", punctuation));
  const solution = capitalizeInitial(assemble(prefix, finite, subject, tail, particle, punctuation));
  return { question, solution };
}

function statementTailFor(verb, particle, pronoun) {
  const meaning = cleanText(verb.meaning).toLocaleLowerCase("en-US");
  if (meaning === "to cost") return "zehn Euro";
  if (meaning === "to be called" && pronoun.id === "sie-they") return "Anna und Paul";
  const example = cleanText(verb.example || "").replace(/^Ich\s+___\s*/i, "").replace(/[.!?]$/, "");
  let baseTail = example;
  if (particle) {
    const words = baseTail.split(" ");
    if (words.at(-1)?.toLocaleLowerCase("de-DE") === particle.toLocaleLowerCase("de-DE")) words.pop();
    baseTail = words.join(" ");
  }
  baseTail = baseTail || "heute";
  // Only rotate through alternatives when the verb's own tail is itself already a bare, generic
  // time adverbial -- meaning any other time word slots in just as naturally. Verbs that need a
  // specific complement (a price, a name, an infinitive) keep their exact fixed phrasing untouched.
  if (genericTailSet.has(baseTail.toLocaleLowerCase("de-DE"))) return sample([...new Set([baseTail, ...genericTails])]);
  return baseTail;
}

function splitForm(verb, correct) {
  const words = correct.toLocaleLowerCase("de-DE").split(" ");
  const candidate = words.at(-1)?.toLocaleLowerCase("de-DE");
  const normalized = normalizeStandardSpelling(verb, words.join(" "));
  const normalizedWords = normalized.split(" ");
  if (normalizedWords.length > 1 && separableParticles.has(candidate)) return { finite: normalizedWords.slice(0, -1).join(" "), particle: normalizedWords.at(-1) };
  return { finite: normalized, particle: "" };
}

function pronounFromProfile(profile) {
  return {
    id: "profile-subject",
    formKey: profile.formKey || "er",
    subject: profile.subject,
    label: profile.label || profile.subject,
    description: profile.description || "third-person singular"
  };
}

function normalizeStandardSpelling(verb, value) {
  if (verb.meaning === "to be called") return value.replaceAll("heiss", "heiß");
  if (verb.verb === "SCHLIEßEN") return value.replaceAll("schliess", "schließ");
  return value;
}

function capitalizeInitial(sentence) {
  return sentence ? sentence[0].toLocaleUpperCase("de-DE") + sentence.slice(1) : sentence;
}

function assemble(...parts) { return parts.filter(Boolean).join(" ").replace(/\s+([?.!,])/g, "$1"); }

function buildOptions(verb, correct, allVerbs, difficulty = "hard") {
  if (difficulty === "easy") {
    // Obviously-wrong distractors: conjugated forms pulled from unrelated verbs.
    const pool = (allVerbs || []).filter(v => v.verb !== verb.verb);
    const picks = shuffle(pool).slice(0, 8).map(v => cleanText(v[sample(formKeys)])).filter(form => form && form !== correct);
    const unique = [...new Set(picks)].slice(0, 3);
    while (unique.length < 3) unique.push(morphologyDistractor(correct, verb.verb, unique.length + 10));
    return balancedShuffle(correct, unique);
  }
  if (difficulty === "hard") {
    // Near-miss spelling variants only -- much easier to mix up with the real answer.
    const candidates = [];
    let attempt = 0;
    while (candidates.length < 3 && attempt < 16) {
      const generated = morphologyDistractor(correct, verb.verb, attempt);
      if (generated !== correct && !candidates.includes(generated)) candidates.push(generated);
      attempt += 1;
    }
    return balancedShuffle(correct, candidates.slice(0, 3));
  }
  // medium (default): other conjugated forms of the same verb, filled out with morphology variants.
  const forms = shuffle([...new Set(formKeys.map(key => cleanText(verb[key])).filter(form => form && form !== correct))]);
  const candidates = [...forms];
  let attempt = 0;
  while (candidates.length < 3 && attempt < 12) {
    const generated = morphologyDistractor(correct, verb.verb, attempt);
    if (generated !== correct && !candidates.includes(generated)) candidates.push(generated);
    attempt += 1;
  }
  return balancedShuffle(correct, candidates.slice(0, 3));
}

function morphologyDistractor(correct, infinitive, attempt) {
  const stem = infinitive.replace(/EN$|N$/i, "");
  const variants = [
    `${stem}E`, `${stem}ST`, `${stem}T`, `${stem}EN`,
    correct.endsWith("ST") ? `${correct.slice(0, -2)}T` : `${correct}ST`,
    correct.endsWith("T") ? `${correct.slice(0, -1)}ST` : `${correct}T`,
    correct.endsWith("EN") ? `${correct.slice(0, -2)}E` : `${correct}EN`
  ];
  return variants[attempt % variants.length];
}

function keyOf(verb) { return cleanText(verb.verb).toLocaleLowerCase("de-DE"); }
function gradeFor(percent) { if (percent >= 90) return "A"; if (percent >= 75) return "B"; if (percent >= 60) return "C"; return "D"; }

// ---- js/vocab.js ----
const posLabels = { noun: "Nomen", verb: "Verb", other: "Wort" };

function vocabEntryKey(entry) {
  return entry.key || entry.word.toLocaleLowerCase("de-DE");
}

function createVocabDeck(words, progress, count) {
  const keys = new Set(progress.usedVocabKeys || []);
  let available = words.filter(entry => !keys.has(vocabEntryKey(entry)));
  if (available.length < count) {
    progress.usedVocabKeys = [];
    available = [...words];
  }
  const chosen = shuffle(available).slice(0, Math.min(count, available.length));
  progress.usedVocabKeys = [...new Set([...(progress.usedVocabKeys || []), ...chosen.map(vocabEntryKey)])];
  return chosen;
}

function buildVocabOptions(entry, allWords, difficulty = "hard", isReverse = false) {
  let distractorPool;
  if (isReverse) {
    // Reverse: English meaning shown, German words as options
    if (difficulty === "easy") {
      distractorPool = allWords.filter(w => w.word !== entry.word && w.pos !== entry.pos && w.meaning !== entry.meaning);
    } else if (difficulty === "hard") {
      distractorPool = allWords.filter(w => w.word !== entry.word && w.pos === entry.pos && w.meaning !== entry.meaning);
    } else {
      distractorPool = allWords.filter(w => w.word !== entry.word && w.meaning !== entry.meaning);
    }
    if (distractorPool.length < 3) distractorPool = allWords.filter(w => w.word !== entry.word && w.meaning !== entry.meaning);
    const distractors = shuffle(distractorPool).slice(0, 3).map(w => w.word);
    return balancedShuffle(entry.word, distractors);
  } else {
    // Forward: German word shown, English meanings as options
    if (difficulty === "easy") {
      distractorPool = allWords.filter(w => w.word !== entry.word && w.pos !== entry.pos && w.meaning !== entry.meaning);
    } else if (difficulty === "hard") {
      distractorPool = allWords.filter(w => w.word !== entry.word && w.pos === entry.pos && w.meaning !== entry.meaning);
    } else {
      distractorPool = allWords.filter(w => w.word !== entry.word && w.meaning !== entry.meaning);
    }
    if (distractorPool.length < 3) distractorPool = allWords.filter(w => w.word !== entry.word && w.meaning !== entry.meaning);
    const distractors = shuffle(distractorPool).slice(0, 3).map(w => w.meaning);
    return balancedShuffle(entry.meaning, distractors);
  }
}

function createVocabQuestion(entry, allWords, progress = null, difficulty = "hard", isReverse = false) {
  const recent = progress?.recentVocabQuestions || [];
  let options;
  let signature;
  let attempt = 0;
  do {
    options = buildVocabOptions(entry, allWords, difficulty, isReverse);
    signature = `${entry.word}|${options.join("~")}|${isReverse ? "rev" : "fwd"}`;
    attempt += 1;
  } while (progress && recent.includes(signature) && attempt < 6);
  if (progress) progress.recentVocabQuestions = [...recent.filter(sig => sig !== signature), signature].slice(-300);
  if (isReverse) {
    return {
      word: entry.meaning,
      meaning: entry.word,
      posLabel: posLabels[entry.pos] || "Wort",
      options,
      correct: entry.word,
      explanation: `“${entry.meaning}” is “${entry.word}”.`,
      signature,
      isReverse: true
    };
  }
  return {
    word: entry.word,
    meaning: entry.meaning,
    posLabel: posLabels[entry.pos] || "Wort",
    options,
    correct: entry.meaning,
    explanation: `“${entry.word}” means “${entry.meaning}”.`,
    signature,
    isReverse: false
  };
}

function createVocabSessionQuestions(deck, allWords, progress = null, difficulty = "hard", isReverse = false) {
  return deck.map(entry => createVocabQuestion(entry, allWords, progress, difficulty, isReverse));
}

const POSSESSIVE_NOUNS = Object.entries(NOUN_BANK).map(([noun, data]) => ({ noun, ...data }));

const TRANSITIVE_VERBS = {

// (adjectives removed — nominative now uses "Das ist/sind …" pattern)

function capitalize(word) { return word.charAt(0).toLocaleUpperCase("de-DE") + word.slice(1); }

function buildSentenceData(owner, noun, grammarCase, correct) {
  if (grammarCase === "nominative") {
    const verb = noun.gender === "pl" ? "sind" : "ist";
    return {
      question: `Das ${verb} ______ ${noun.noun}.`,
      solution: `Das ${verb} ${correct} ${noun.noun}.`
    };
  }
  const verbName = sample(noun.verbs);
  const verbForm = TRANSITIVE_VERBS[verbName][owner.verbKey];
  const subject = capitalize(owner.label);
  const tails = { nehmen: "mit", finden: "nicht", suchen: "gerade", reparieren: "gerade", putzen: "gerade", öffnen: "gerade", bringen: "mit" };
  const tail = tails[verbName] ? ` ${tails[verbName]}` : "";
  return {
    question: `${subject} ${verbForm} ______ ${noun.noun}${tail}.`,
    solution: `${subject} ${verbForm} ${correct} ${noun.noun}${tail}.`
  };
}

function buildPossessiveOptions(owner, noun, grammarCase, correct, difficulty = "hard") {
  const candidates = new Set();
  const genders = ["m", "f", "n", "pl"];
  const otherGenders = genders.filter(g => g !== noun.gender);
  const otherCase = grammarCase === "nominative" ? "accusative" : "nominative";
  const otherOwners = POSSESSIVE_OWNERS.filter(o => o.id !== owner.id);

  if (difficulty === "easy") {
    shuffle(otherOwners).forEach(o => { if (candidates.size < 3) candidates.add(decline(o.stem, noun.gender, grammarCase)); });
  } else if (difficulty === "hard") {
    shuffle(otherGenders).forEach(g => candidates.add(decline(owner.stem, g, grammarCase)));
    candidates.add(decline(owner.stem, noun.gender, otherCase));
  } else {
    candidates.add(decline(owner.stem, sample(otherGenders), grammarCase));
    candidates.add(decline(owner.stem, noun.gender, otherCase));
    candidates.add(decline(sample(otherOwners).stem, noun.gender, grammarCase));
  }

  const seen = new Set([correct.toLocaleLowerCase("de-DE")]);
  const options = [];
  for (const candidate of candidates) {
    const key = candidate.toLocaleLowerCase("de-DE");
    if (seen.has(key)) continue;
    seen.add(key);
    options.push(candidate);
  }
  while (options.length < 3) {
    const o = sample(otherOwners);
    const g = sample(genders);
    const candidate = decline(o.stem, g, sample(["nominative", "accusative"]));
    const key = candidate.toLocaleLowerCase("de-DE");
    if (!seen.has(key)) { seen.add(key); options.push(candidate); }
  }
  return balancedShuffle(correct, options.slice(0, 3));
}

function createPossessiveQuestion(noun, allNouns, progress = null, difficulty = "hard") {
  const recent = progress?.recentPossessiveQuestions || [];
  let result;
  let attempt = 0;
  do {
    const owner = sample(POSSESSIVE_OWNERS);
    const grammarCase = sample(["nominative", "accusative"]);
    const correct = decline(owner.stem, noun.gender, grammarCase);
    const sentenceData = buildSentenceData(owner, noun, grammarCase, correct);
    const options = buildPossessiveOptions(owner, noun, grammarCase, correct, difficulty);
    const genderLabel = { m: "der", f: "die", n: "das", pl: "die (Pl.)" }[noun.gender];
    result = {
      noun: noun.noun, meaning: noun.meaning, owner, grammarCase, correct, options,
      sentence: sentenceData.question,
      solutionSentence: sentenceData.solution,
      caseLabel: grammarCase === "nominative" ? "Nominativ" : "Akkusativ",
      explanation: `${capitalize(ownerDisplayLabel(owner))} + ${genderLabel} ${noun.noun} (${grammarCase === "nominative" ? "Nominativ" : "Akkusativ"}) → “${correct}”.`,
      signature: `${noun.noun}|${owner.id}|${grammarCase}|${sentenceData.question}`
    };
    attempt += 1;
  } while (progress && recent.includes(result.signature) && attempt < 12);
  if (progress) progress.recentPossessiveQuestions = [...recent.filter(sig => sig !== result.signature), result.signature].slice(-300);
  return result;
}

function createPossessiveDeck(nouns, progress, count) {
  const keys = new Set(progress.usedPossessiveKeys || []);
  let available = nouns.filter(n => !keys.has(n.noun.toLocaleLowerCase("de-DE")));
  if (available.length < count) {
    progress.usedPossessiveKeys = [];
    available = [...nouns];
  }
  const chosen = shuffle(available).slice(0, Math.min(count, available.length));
  progress.usedPossessiveKeys = [...new Set([...(progress.usedPossessiveKeys || []), ...chosen.map(n => n.noun.toLocaleLowerCase("de-DE"))])];
  return chosen;
}

function createPossessiveSessionQuestions(deck, allNouns, progress = null, difficulty = "hard") {
  return deck.map(noun => createPossessiveQuestion(noun, allNouns, progress, difficulty));
}

const ZAHLEN_RANGES = { "0-20": [0,20], "0-100": [0,100], "0-1000": [0,1000] };
const ZAHLEN_EXERCISES = ["digit-word","word-digit","hoeren","preis","uhrzeit"];

function numberToGerman(n){
  if(n===0) return "null";
  const ones=["","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun"];
  const teens=["zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
  const tens=["","zehn","zwanzig","dreißig","vierzig","fünfzig","sechzig","siebzig","achtzig","neunzig"];
  if(n<10) return ones[n];
  if(n<20) return teens[n-10];
  if(n<100){
    const t=Math.floor(n/10), o=n%10;
    if(o===0) return tens[t];
    if(o===1) return "einund"+tens[t];
    return ones[o]+"und"+tens[t];
  }
  if(n<1000){
    const h=Math.floor(n/100), r=n%100;
    const hWord=h===1?"einhundert":ones[h]+"hundert";
    if(r===0) return hWord;
    return hWord+numberToGerman(r);
  }
  if(n===1000) return "eintausend";
  return String(n);
}
function numberToGermanParts(n){
  if(n<100) return [numberToGerman(n)];
  if(n<1000){
    const h=Math.floor(n/100), r=n%100;
    const hWord=h===1?"einhundert":numberToGerman(h)+"hundert";
    if(r===0) return [hWord];
    return [hWord+"-", numberToGerman(r)];
  }
  return [numberToGerman(n)];
}
function timeToGerman(h,m){
  h=h%12||12;
  const hWord=numberToGerman(h);
  if(m===0) return hWord+" Uhr";
  if(m===15) return "Viertel nach "+hWord;
  if(m===30) return "halb "+numberToGerman(h%12+1||1);
  if(m===45) return "Viertel vor "+numberToGerman(h%12+1||1);
  return hWord+" Uhr "+numberToGerman(m);
}
const PREIS_ITEMS = [
  { name: "Die Jacke", min: 20, max: 100 },
  { name: "Das Brot", min: 2, max: 6 },
  { name: "Die Pizza", min: 5, max: 15 },
  { name: "Das Gemüse", min: 3, max: 8 },

  { name: "Das Fahrrad", min: 150, max: 900 },
  { name: "Das Handy", min: 100, max: 900 }

function createZahlenQuestion(range, allNumbers, progress, difficulty){
  const [min,max]=ZAHLEN_RANGES[range]||[0,100];
  const type=sample(ZAHLEN_EXERCISES);
  let n=Math.floor(Math.random()*(max-min+1))+min;
  let word=numberToGerman(n);
  let question, solution, correct, options, explanation, extra={};
  if(type==="digit-word"){
    correct=word; options=balancedShuffle(correct, shuffle(allNumbers).slice(0,20).map(x=>numberToGerman(x)).filter(w=>w!==correct).slice(0,3));
    question=String(n); solution=word; explanation=`${n} = "${word}".`;
  } else if(type==="word-digit"){
    correct=String(n); options=balancedShuffle(correct, shuffle(allNumbers).slice(0,20).map(x=>String(x)).filter(x=>x!==correct).slice(0,3));
    question=word; solution=String(n); explanation=`"${word}" = ${n}.`; extra.wordParts=numberToGermanParts(n);
  } else if(type==="hoeren"){
    correct=word; options=balancedShuffle(correct, shuffle(allNumbers).slice(0,20).map(x=>numberToGerman(x)).filter(w=>w!==correct).slice(0,3));
    question="Was hast du gehört?"; solution=word; explanation=`Gehört: "${word}" = ${n}.`; extra.isHoeren=true; extra.hoerWord=word;
  } else if(type==="preis"){
    const item=sample(PREIS_ITEMS);
    n=Math.floor(Math.random()*(item.max-item.min+1))+item.min;
    correct=word=numberToGerman(n);
    let lo=item.min, hi=item.max, span=Math.max(1,item.max-item.min);
    let d=[], guard=40;
    while(d.length<3){
      while(d.length<3&&guard--){
        const dn=Math.floor(Math.random()*(hi-lo+1))+lo;
        if(dn===n||dn<=0) continue;
        const dw=numberToGerman(dn);
        if(!d.includes(dw)) d.push(dw);
      }
      lo=Math.max(0,lo-span); hi=Math.min(1000,hi+span); span*=2;
      if(hi-lo>4000) break;
    }
    options=balancedShuffle(correct,d.slice(0,3));
    question=`${item.name} kostet ___ Euro.`; solution=`${item.name} kostet ${word} Euro.`; explanation=`${n} € = ${word} Euro.`; extra.priceTag=`${n} €`;
  } else {
    const h=Math.floor(Math.random()*12)+1, mins=[0,15,30,45][Math.floor(Math.random()*4)];
    const timeWord=timeToGerman(h,mins);
    correct=timeWord; const distractors=shuffle(allNumbers).slice(0,20).map(_=>{const hh=Math.floor(Math.random()*12)+1, mm=[0,15,30,45][Math.floor(Math.random()*4)]; return timeToGerman(hh,mm);}).filter(w=>w!==correct).slice(0,3);
    options=balancedShuffle(correct, distractors);
    question="Wie spät ist es? Es ist ___.";
    solution=`Es ist ${timeWord}.`;
    explanation=`${String(h).padStart(2,"0")}:${String(mins).padStart(2,"0")} = "${timeWord}".`;
    extra.isUhrzeit=true; extra.hour=h; extra.minute=mins;
  }
  return { n, word, type, question, solutionSentence:solution, correct, options, explanation, signature:`${type}|${n}|${correct}`, ...extra };
}
function createZahlenDeck(range, allNumbers, progress, count){
  const deck=[];
  for(let i=0;i<count;i++) deck.push(createZahlenQuestion(range, allNumbers, progress, "hard"));

}
function analogClockSVG(hour, minute){
  const cx=60, cy=60, r=52;
  const hAngle=(hour%12)*30+minute*0.5-90, mAngle=minute*6-90;
  const hX=cx+Math.cos(hAngle*Math.PI/180)*28, hY=cy+Math.sin(hAngle*Math.PI/180)*28;
  const mX=cx+Math.cos(mAngle*Math.PI/180)*38, mY=cy+Math.sin(mAngle*Math.PI/180)*38;
  let ticks="";
  for(let i=0;i<12;i++){ const a=i*30-90, x1=cx+Math.cos(a*Math.PI/180)*(r-4), y1=cy+Math.sin(a*Math.PI/180)*(r-4), x2=cx+Math.cos(a*Math.PI/180)*r, y2=cy+Math.sin(a*Math.PI/180)*r; ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#23324d" stroke-width="${i%3===0?2:1}" />`; }
  return `<svg viewBox="0 0 120 120" width="160" height="160" style="display:block;margin:0 auto;background:#fbf7ec;border:2px solid #23324d;border-radius:50%;"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fbf7ec" stroke="#23324d" stroke-width="2"/>${ticks}<line x1="${cx}" y1="${cy}" x2="${hX}" y2="${hY}" stroke="#23324d" stroke-width="4" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${mX}" y2="${mY}" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="5" fill="#23324d"/></svg>`;
}

    ${isB1 && b1GlossaryError ? `<section class="panel glossary-error" role="alert"><h2>Glossary unavailable</h2><p>The word list could not be loaded. Check your connection and try again.</p><button type="button" class="secondary-button" data-action="retry-b1-glossary">Try again</button></section>` : ""}
    <button type="button" class="panel mode-card" data-action="start-session" data-mode="practice" data-kind="${kind}" data-level="${vocabLevel}">

      <p class="page-copy">${isChapterGlossary ? "Choose a chapter and practise every entry in it." : "No timer, unlimited questions."}</p>

async function importWorkbook(file) {
  if (!/\.xlsx$/i.test(file.name)) throw new Error("Choose an .xlsx workbook.");
  const entries = await unzip(await file.arrayBuffer());
  const sheetPath = Object.keys(entries).find(path => /^xl\/worksheets\/sheet\d+\.xml$/i.test(path));
  if (!sheetPath) throw new Error("No worksheet was found in this workbook.");
  const shared = entries["xl/sharedStrings.xml"] ? parseSharedStrings(new TextDecoder().decode(entries["xl/sharedStrings.xml"])) : [];
  const rows = parseSheet(new TextDecoder().decode(entries[sheetPath]), shared);
  if (rows.length < 2) throw new Error("The worksheet needs a header row and at least one verb row.");
  const columns = resolveColumns(rows[0]);
  if (!columns.verb || !columns.ich || !columns.du || !columns.er || !columns.wir || !columns.ihr || !columns.sie) {
    throw new Error("Required headers: verb/infinitiv, ich, du, er, wir, ihr, and sie.");
  }
  const verbs = rows.slice(1).map(row => normalizeRow(row, columns)).filter(Boolean);
  if (!verbs.length) throw new Error("No complete verb rows were found.");
  return verbs;
}

function resolveColumns(headers) {
  const normalized = headers.map(header => cleanText(header).toLocaleLowerCase("de-DE").replace(/[()_,./-]/g, " ").replace(/\s+/g, " ").trim());
  const find = predicate => normalized.findIndex(predicate) + 1;

  const contains = word => value => value.split(" ").includes(word);
  const verb = find(value => starts("verb")(value) || contains("infinitiv")(value) || contains("infinitive")(value));
  const meaning = find(value => starts("meaning")(value) || contains("english")(value) || contains("englisch")(value) || contains("translation")(value) || contains("übersetzung")(value) || contains("uebersetzung")(value));
  const ich = find(starts("ich"));
  const du = find(starts("du"));
  const er = find(value => starts("er")(value) || (contains("singular")(value) && contains("er")(value)));
  const wir = find(value => starts("wir")(value) || starts("plural")(value) || contains("wir")(value));
  const ihr = find(starts("ihr"));
  const namedSie = find(value => starts("sie")(value) || value.includes("sie plural"));
  const formalSie = find(value => value.includes("sie formal") || value.includes("sie höflich") || value.includes("sie hoeflich") || value.includes("sie singular"));

}

function normalizeRow(cells, columns) {
  const field = key => String(cells[columns[key]] ?? "");
  const verb = field("verb");
  const forms = { ich: field("ich"), du: field("du"), er: field("er"), wir: field("wir"), ihr: field("ihr"), sie: field("sie") || field("formalSie") };
  if (!verb || Object.values(forms).some(value => !value)) return null;
  const meaning = field("meaning") || inferMeaning(verb);
  return { verb, meaning, ...forms, es: field("es") || forms.er, formalSie: field("formalSie") || forms.sie, irregular: detectIrregular(verb, forms), example: createExample(verb, meaning) };

function detectIrregular(verb, forms) {
  const lower = verb.toLocaleLowerCase("de-DE");

  const stem = lower.replace(/en$|n$/, "");
  const withE = /(t|d|chn|ffn|gn|tm)$/.test(stem);

function createExample(verb, meaning) {
  const subject = "Ich";
  const lower = verb.toLocaleLowerCase("de-DE");
  const context = {
    essen: "mein Frühstück", trinken: "ein Glas Wasser", lesen: "ein spannendes Buch", schreiben: "eine kurze Nachricht",
    lernen: "jeden Abend Deutsch", arbeiten: "heute im Büro", wohnen: "in einer ruhigen Stadt", fahren: "morgen mit dem Zug",
    gehen: "nach der Arbeit nach Hause", kommen: "später vorbei", sehen: "den neuen Film", hören: "gerne Musik",
    sprechen: "mit meiner Lehrerin", kaufen: "frisches Brot", kochen: "heute das Abendessen", spielen: "am Wochenende Fußball",
    schlafen: "am Wochenende länger", helfen: "meinem Freund", finden: "die Antwort", brauchen: "etwas Zeit",
    machen: "meine Hausaufgaben", nehmen: "den Bus", geben: "dir Bescheid", bleiben: "heute zu Hause"

}

function inferMeaning(verb) {
  const dictionary = { sein: "to be", haben: "to have", werden: "to become", können: "can / to be able to", müssen: "must / to have to", wollen: "to want", sollen: "should / to be supposed to", dürfen: "may / to be allowed to", mögen: "to like", wissen: "to know", gehen: "to go", kommen: "to come", machen: "to do / to make", geben: "to give", nehmen: "to take", sehen: "to see", finden: "to find", bleiben: "to stay", sprechen: "to speak", lesen: "to read", schreiben: "to write", essen: "to eat", trinken: "to drink", schlafen: "to sleep", fahren: "to drive / to travel", laufen: "to run", helfen: "to help", arbeiten: "to work", lernen: "to learn", wohnen: "to live / to reside", kaufen: "to buy", kochen: "to cook", hören: "to hear / to listen", spielen: "to play", brauchen: "to need" };

}

function parseSharedStrings(xml) {

function parseSheet(xml, shared) {

const STORAGE_KEY = "german-conjugation-master-v1";
const STORAGE_KEYS = {
  possessive: "german-possessive-v2",
  vocab: "german-vocab-v2",
  zahlen: "german-zahlen-v2",
  conjugation: "german-conjugation-v2"
};
const defaults = {
  settings: { animations: true, sound: true },
  stats: { total: 0, correct: 0, wrong: 0, currentStreak: 0, bestStreak: 0, score: 0, totalTimeMs: 0, correctVerbs: {}, missedVerbs: {} },
  achievements: [],
  progress: { usedVerbKeys: [] },
  customVerbs: null,
  b1PlusSession: null,
  a1Session: null
};

function hasArtifactStorage() {
  return typeof window !== "undefined" && !!window.storage && typeof window.storage.get === "function";
}
async function storageGet(key) {
  if (hasArtifactStorage()) return window.storage.get(key);
  const value = window.localStorage.getItem(key);
  if (value === null) throw new Error("not found");
  return { key, value };
}
async function storageSet(key, value) {
  if (hasArtifactStorage()) return window.storage.set(key, value);
  window.localStorage.setItem(key, value);
  return { key, value };
}
async function storageDelete(key) {
  if (hasArtifactStorage()) return window.storage.delete(key);
  window.localStorage.removeItem(key);
  return { key, deleted: true };
}

function cloneDefaults() { return JSON.parse(JSON.stringify(defaults)); }

async function loadState() {
  try {
    const result = await storageGet(STORAGE_KEY);
    const saved = result ? JSON.parse(result.value) : null;
    const mergedSettings = { ...defaults.settings, ...(saved?.settings || {}) };
    for (const key of Object.keys(mergedSettings)) {
      if (!(key in defaults.settings)) delete mergedSettings[key];
    }
    return { ...cloneDefaults(), ...saved, settings: mergedSettings, stats: { ...defaults.stats, ...(saved?.stats || {}) } };
  } catch { return cloneDefaults(); }
}
function saveState(state) { storageSet(STORAGE_KEY, JSON.stringify(state)).catch(() => {}); }
async function resetState() { try { await storageDelete(STORAGE_KEY); } catch { /* nothing stored yet */ } return cloneDefaults(); }
function recordAnswer(state, { key, correct, elapsedMs }) {
  const stats = state.stats;
  stats.total += 1;
  stats.totalTimeMs += elapsedMs;
  if (correct) {
    stats.correct += 1;
    stats.score += 10;
    stats.currentStreak += 1;
    stats.bestStreak = Math.max(stats.bestStreak, stats.currentStreak);
    stats.correctVerbs[key] = (stats.correctVerbs[key] || 0) + 1;
  } else {
    stats.wrong += 1;
    stats.currentStreak = 0;
    stats.missedVerbs[key] = (stats.missedVerbs[key] || 0) + 1;
  }
  saveState(state);
}
function storeImportedVerbs(state, rows) {
  state.customVerbs = rows.map(row => ({ ...row, verb: cleanText(row.verb), meaning: cleanText(row.meaning || "meaning unavailable") }));
  saveState(state);
}

function inferGlossaryPos(german, english) {
  if (/^(der|die|das|der\/die)\b/i.test(german)) return "noun";
  if (/^to\b/i.test(english)) return "verb";
  return "other";
}

async function loadA1Glossary() {
  if (a1GlossaryEntries.length) return a1GlossaryEntries;
  if (!a1GlossaryPromise) {
    a1GlossaryPromise = fetch(A1_DATA_URL).then(async response => {
      if (!response.ok) throw new Error(`A1 glossary could not be loaded (${response.status}).`);
      const data = await response.json();
      if (!Array.isArray(data.entries) || data.entries.length !== A1_ENTRY_COUNT) throw new Error("The A1 glossary data is incomplete.");
      if (data.entries.some(entry => !String(entry.german || "").trim() || !String(entry.english || "").trim())) throw new Error("The A1 glossary contains an incomplete entry.");
      if (data.entries.some(entry => !String(entry.id || "").trim()) || new Set(data.entries.map(entry => entry.id)).size !== A1_ENTRY_COUNT) throw new Error("The A1 glossary has invalid entry identifiers.");
      a1GlossaryError = false;
      a1GlossaryDocument = data.document || null;
      a1GlossaryEntries = data.entries;
      glossaryWords = data.entries.map(entry => ({
        key: `a1:${entry.id}`,
        word: entry.german,
        meaning: entry.english,
        pos: inferGlossaryPos(entry.german, entry.english),
        chapter: entry.chapter?.number,
        section: entry.section,
        activity: entry.activity
      }));
      return a1GlossaryEntries;
    }).catch(error => {
      a1GlossaryPromise = null;
      throw error;
    });
  }
  return a1GlossaryPromise;
}

  if (action === "open-a1-glossary" || action === "retry-a1-glossary") { await openA1Glossary(button); return; }
  if (action === "open-b1-glossary" || action === "retry-b1-glossary") { await openB1Glossary(button); return; }
  if (action === "filter-b1-chapter") { setB1ChapterFilter(button.dataset.chapter); return; }
  if (action === "filter-a1-chapter") { setA1ChapterFilter(button.dataset.chapter); return; }
  if (action === "open-a2-glossary") { await openA2Glossary(button); return; }
  if (action === "filter-a2-chapter") {
    setA2ChapterFilter(button.dataset.chapter);
    return;
  }
  if (action === "open-b1plus-glossary") { await openB1PlusGlossary(button); return; }
  if (action === "retry-b1plus-glossary") { await openB1PlusGlossary(button); return; }
  if (action === "filter-b1plus-chapter") {
    setB1PlusChapterFilter(button.dataset.chapter);
    return;
  }
  if (action === "start-session") {
    const mode = button.dataset.mode;
    const kind = button.dataset.kind || "vocab";
    if (kind === "vocab" && pendingVocabLevel === "a1" && mode === "practice") {
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
      try { await loadA1Glossary(); render("a1-chapter-select"); }

      finally { button.disabled = false; button.removeAttribute("aria-busy"); }
      return;
    }
    if (kind === "vocab" && pendingVocabLevel === "a2" && mode === "practice") {
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
      try { await loadA2Glossary(); render("a2-chapter-select"); }
      catch (error) { toast(error.message || "The A2 glossary could not be loaded.", "error"); }
      finally { button.disabled = false; button.removeAttribute("aria-busy"); }
      return;
    }
    if (kind === "vocab" && pendingVocabLevel === "b1plus" && mode === "practice") {
      button.disabled = true;
      button.setAttribute("aria-busy", "true");
      try { await loadB1PlusGlossary(); render("b1plus-chapter-select"); }
      catch (error) { toast(error.message || "The B1+ glossary could not be loaded.", "error"); }
      finally { button.disabled = false; button.removeAttribute("aria-busy"); }
      return;
    }
    if (kind === "vocab" || kind === "vocab-reverse") await startVocabSession(mode, pendingVocabLevel, kind);
    else if (kind === "possessive") startPossessiveSession(mode);
    else if (kind === "zahlen") startZahlenSession(mode, pendingZahlenRange);
    else startSession(mode);
  }
  if (action === "choose-a1-chapter") {
    const chapter = Number(button.dataset.chapter);
    if (resumeA1Session(chapter)) return;
    const saved = savedA1Session();
    if (saved && !await confirmation("Start another chapter?", `Your saved position in Kapitel ${saved.chapter} will be replaced. Submitted answer statistics remain saved.`, `Start Kapitel ${chapter}`)) return;
    await startVocabSession("practice", "a1", "vocab", chapter);
    return;
  }
  if (action === "choose-a2-chapter") { await startVocabSession("practice", "a2", "vocab", button.dataset.chapter); return; }
  if (action === "choose-b1plus-chapter") {
    const chapter = Number(button.dataset.chapter);
    if (resumeB1PlusSession(chapter)) return;
    const saved = savedB1PlusSession();
    if (saved && !await confirmation("Start another chapter?", `Your saved position in Kapitel ${saved.chapter} will be replaced. Submitted answer statistics remain saved.`, `Start Kapitel ${chapter}`)) return;
    await startVocabSession("practice", "b1plus", "vocab", chapter);
    return;
  }
  if (action === "answer") answer(button.dataset.answer);
  if (action === "para-answer") { const bi = parseInt(button.dataset.blank, 10); paraAnswer(bi, button.dataset.answer); return; }
  if (action === "next-question") nextQuestion();
  if (action === "play-again") {
    const s = activeSession || lastSession;
    if (s?.kind === "vocab") await startVocabSession(s.mode, s.level, s.direction === "reverse" ? "vocab-reverse" : "vocab", s.chapter);
    else if (s?.kind === "possessive") startPossessiveSession(s.mode);
    else if (s?.kind === "zahlen") startZahlenSession(s.mode, s.range || pendingZahlenRange);
    else startSession(s?.mode || "practice");
  }
  if (action === "abandon-session") abandonSession();
  if (action === "reset-progress") {
    if (await confirmation("Reset all local progress?", "This removes statistics, achievements, and any imported workbook from this browser.", "Reset Everything")) { state = await resetState(); document.body.classList.remove("no-animations"); activeSession = null; stopTimer(); render("home"); updatePunchHoles(); toast("Local progress reset."); }
  }
  if (action.startsWith("speak") && activeSession) {
    if (window.speechSynthesis && speechSynthesis.speaking) {
      speechSynthesis.cancel();
      document.querySelectorAll('.speaking').forEach(b => b.classList.remove('speaking'));
      return;
    }
    const btn = button;
    btn.classList.add("speaking");
    const clearSpeaking = () => btn.classList.remove("speaking");
    let p;
    if (action === "speak-verb") p = speakVerb(activeSession.questions[activeSession.index].verb);
    else if (action === "speak-form") p = speak(activeSession.questions[activeSession.index].correct);
    else if (action === "speak-word") { const q = activeSession.questions[activeSession.index]; p = speakWord(q.word, q.isReverse ? "en-GB" : "de-DE"); }
    else if (action === "speak-german-answer") { const q = activeSession.questions[activeSession.index]; p = speakWord(q.isReverse ? q.correct : q.word, "de-DE"); }
    else if (action === "speak-noun") p = speakWord(activeSession.questions[activeSession.index].noun);
    else if (action === "speak-sentence") p = speakSentence(activeSession.questions[activeSession.index].solutionSentence);
    else if (action === "speak-zahlen") p = speakWord(activeSession.questions[activeSession.index].hoerWord || activeSession.questions[activeSession.index].correct, "de-DE");
    if (p) p.then(clearSpeaking, clearSpeaking);
    setTimeout(clearSpeaking, 6000);
  }
}
function paraAnswer(blankIndex, selected) {
  if (!activeSession) return;
  const question = activeSession.questions[activeSession.index];
  if (!question?.isParagraph) return;
  if (!activeSession.currentAnswer) activeSession.currentAnswer = { blanks: Array(question.blanks.length).fill(null), paragraph: true };
  if (activeSession.currentAnswer.blanks[blankIndex]) return;
  const blank = question.blanks[blankIndex];
  const correct = selected === blank.correctForm;
  activeSession.currentAnswer.blanks[blankIndex] = { selected, correct, correctAnswer: blank.correctForm };
  const allAnswered = activeSession.currentAnswer.blanks.every(b => b !== null);
  if (allAnswered) {
    const correctCount = activeSession.currentAnswer.blanks.filter(b => b.correct).length;
    const allCorrect = correctCount === question.blanks.length;
    const elapsedMs = Math.max(0, performance.now() - activeSession.questionStartedAt);
    activeSession.answers.push({ question, selected: activeSession.currentAnswer.blanks.map(b=>b.selected).join(', '), correct: allCorrect, elapsedMs, correctCount, blankCount: question.blanks.length });
    activeSession.score += correctCount * 10;
    if (allCorrect) activeSession.currentStreak = (activeSession.currentStreak || 0) + 1; else activeSession.currentStreak = 0;
    const key = normalizeVerbKey(question.noun);
    recordAnswer(state, { key, correct: allCorrect, elapsedMs });
    if (!allCorrect && !activeSession.requeued.has(question.signature)) {
      activeSession.requeued.add(question.signature);
      const insertAt = Math.min(activeSession.index + 3 + Math.floor(Math.random() * 3), activeSession.questions.length);
      activeSession.questions.splice(insertAt, 0, question);
    }
    sound(allCorrect ? "correct" : "wrong");
    if (!allCorrect) triggerWrongFeedback();
    if (window.Mascot) { if (allCorrect) { if (activeSession.currentStreak >= 5) Mascot.streak(); else Mascot.correct(); } else Mascot.wrong(); }
  } else {
    sound(correct ? "correct" : "wrong");
    if (!correct) triggerWrongFeedback();
  }
  renderActiveQuestion();
  focusAfterAnswer();
}
function answer(selected) {
  if (!activeSession || activeSession.currentAnswer) return;
  const question = activeSession.questions[activeSession.index];
  if (question.isParagraph) return; // paragraph uses paraAnswer
  const correct = selected === question.correct;
  const elapsedMs = Math.max(0, performance.now() - activeSession.questionStartedAt);
  activeSession.currentAnswer = { selected, correct, correctAnswer: question.correct, elapsedMs };
  activeSession.answers.push({ question, selected, correct, elapsedMs });
  if (correct) { activeSession.score += 10; activeSession.currentStreak = (activeSession.currentStreak || 0) + 1; }
  else activeSession.currentStreak = 0;
  const key = normalizeVerbKey(activeSession.kind === "vocab" ? question.word : activeSession.kind === "possessive" ? question.noun : activeSession.kind === "zahlen" ? `zahlen-${question.type}-${question.n}` : question.verb.verb);
  recordAnswer(state, { key, correct, elapsedMs });
  if (!correct && !activeSession.requeued.has(question.signature)) {
    activeSession.requeued.add(question.signature);
    const insertAt = Math.min(activeSession.index + 3 + Math.floor(Math.random() * 3), activeSession.questions.length);
    activeSession.questions.splice(insertAt, 0, question);
  }
  saveB1PlusSession();
  saveA1Session();
  sound(correct ? "correct" : "wrong");
  if (!correct) triggerWrongFeedback();
  if (window.Mascot) {
    if (correct) {
      if (activeSession.currentStreak >= 5) Mascot.streak();
      else if (activeSession.answers.length === activeSession.questions.length && activeSession.answers.every(a => a.correct)) Mascot.perfect();
      else Mascot.correct();
    } else {
      Mascot.wrong();
    }
  }
  renderActiveQuestion();
  focusAfterAnswer();
}
function triggerWrongFeedback() {
  if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
  const appShell = document.querySelector(".app-shell");
  if (appShell) {
    appShell.classList.add("shake");
    setTimeout(() => appShell.classList.remove("shake"), 500);
  }
}
function nextQuestion() {
  if (!activeSession?.currentAnswer) return;
  const q = activeSession.questions[activeSession.index];
  if (q.isParagraph && !activeSession.currentAnswer.blanks?.every(b => b !== null)) return;
  if (activeSession.index + 1 >= activeSession.questions.length) return finishSession(false);
  activeSession.index += 1; activeSession.currentAnswer = null; activeSession.questionStartedAt = performance.now();
  saveB1PlusSession();
  saveA1Session();
  renderActiveQuestion();
  app.querySelector('[data-action="answer"], [data-action="para-answer"]')?.focus({ preventScroll: true });
}
function finishSession(timedOut) {
  if (!activeSession) return;
  stopTimer();
  if (timedOut) {
    const answered = new Set(activeSession.answers.map(answer => answer.question));
    activeSession.questions.filter(question => !answered.has(question)).forEach(question => activeSession.answers.push({ question, selected: "No answer", correct: false, elapsedMs: 0 }));
    toast("Time is up — exam submitted.");
  }
  const total = activeSession.mode === "exam" ? activeSession.questions.length : activeSession.answers.length;
  const correctCount = activeSession.answers.filter(answer => answer.correct).length;
  activeSession.grade = gradeFor(percent(correctCount, total));
  if (activeSession.answers.length >= 5) {
    if (!state.progress) state.progress = { usedVerbKeys: [] };
    state.progress.seitenDone = state.progress.seitenDone || {};
    if (!state.progress.seitenDone[activeSession.kind]) { state.progress.seitenDone[activeSession.kind] = true; }
  }
  if (activeSession.kind === "vocab" && activeSession.mode === "practice" && activeSession.level === "a1" && activeSession.chapter) state.a1Session = null;
  if (activeSession.kind === "vocab" && activeSession.mode === "practice" && activeSession.level === "b1plus" && activeSession.chapter) state.b1PlusSession = null;
  const newlyUnlocked = updateAchievements(state, activeSession); saveState(state);
  newlyUnlocked.forEach(item => window.setTimeout(() => toast(`Achievement unlocked: ${item.title}`), 350));
  updatePunchHoles();
  if (total >= 5 && percent(correctCount, total) >= 80) celebrate();
  if (window.Mascot && correctCount === total && total > 0) Mascot.perfect();
  lastSession = activeSession;
  render("review");
  activeSession = null;
}
async function abandonSession(body = "You'll see your results so far. Answers already submitted are saved.") {
  const ok = await confirmation("End this session?", body, "End Session");
  if (ok) finishSession(false);
  return ok;
}
function celebrate() {
  if (!state.settings.animations) return;
  const colors = ["#c0392b", "#2f7a45", "#f0b429", "#23324d"];
  const layer = document.createElement("div");
  layer.className = "confetti-layer";
  for (let i = 0; i < 140; i++) {
    const piece = document.createElement("span");
    piece.className = "confetti-piece";
    piece.style.left = `${Math.random() * 100}%`;
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = `${Math.random() * 0.6}s`;
    piece.style.animationDuration = `${1.6 + Math.random() * 1.8}s`;
    piece.style.setProperty("--drift", `${(Math.random() - 0.5) * 260}px`);
    piece.style.setProperty("--rot", `${Math.random() * 720 - 360}deg`);
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  window.setTimeout(() => layer.remove(), 3600);
}
async function importSelectedWorkbook() {
  const input = document.querySelector("#workbook-file"); const file = input?.files?.[0];
  if (!file) return toast("Choose an XLSX workbook first.", "error");
  try {
    const rows = await importWorkbook(file); validateVerbs(rows); storeImportedVerbs(state, rows); state.progress = { usedVerbKeys: [], recentQuestions: [] }; saveState(state); render("settings"); toast(`${rows.length} verb records imported exactly from ${file.name}.`);
  } catch (error) { toast(error.message || "The workbook could not be imported.", "error"); }
}
function handleSetting(event) {
  const b1ChapterSelect = event.target.closest("[data-b1-chapter-select]");
  if (b1ChapterSelect) { setB1ChapterFilter(b1ChapterSelect.value); return; }
  const a1ChapterSelect = event.target.closest("[data-a1-chapter-select]");
  if (a1ChapterSelect) { setA1ChapterFilter(a1ChapterSelect.value); return; }
  const a2ChapterSelect = event.target.closest("[data-a2-chapter-select]");
  if (a2ChapterSelect) { setA2ChapterFilter(a2ChapterSelect.value); return; }
  const chapterSelect = event.target.closest("[data-b1plus-chapter-select]");
  if (chapterSelect) { setB1PlusChapterFilter(chapterSelect.value); return; }
  const control = event.target.closest("[data-setting]"); if (!control) return;
  state.settings[control.dataset.setting] = control.checked; saveState(state);
  if (control.dataset.setting === "animations") document.body.classList.toggle("no-animations", !control.checked);
  sound("click");
}
function sound(kind) {
  if (!state.settings.sound || !window.AudioContext) return;
  try { const context = new AudioContext(); const oscillator = context.createOscillator(); const gain = context.createGain(); const map = { click: [440, .025], correct: [660, .13], wrong: [170, .16] }; const [frequency, duration] = map[kind]; oscillator.frequency.value = frequency; oscillator.type = kind === "wrong" ? "sawtooth" : "sine"; gain.gain.setValueAtTime(.035, context.currentTime); gain.gain.exponentialRampToValueAtTime(.001, context.currentTime + duration); oscillator.connect(gain).connect(context.destination); oscillator.start(); oscillator.stop(context.currentTime + duration); oscillator.onended = () => context.close(); } catch { /* Audio may require a user gesture or be unavailable. */ }
}

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
