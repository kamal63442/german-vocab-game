<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Possessiv — Neues Set (Final, ohne Englisch)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;padding:26px 14px;background:#e8dfc4;font-family:"Nunito",system-ui,sans-serif;color:#23324d;
  background-image:linear-gradient(rgba(120,148,191,.35) 1px,transparent 1px);background-size:100% 21px;}
h1{font-family:"Kalam",cursive;font-size:1.65rem;text-align:center;margin:0;transform:rotate(-1deg);}
.note{text-align:center;font-size:.76rem;font-weight:600;color:#4c5f7d;margin:4px 0 14px;}
.wrap{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.card{border:2px solid #23324d;border-radius:8px;background:#fbf7ec;box-shadow:3px 3px 0 rgba(35,50,77,.14);padding:13px 15px;display:grid;gap:10px;}
.kicker{color:#c0392b;font-family:"Kalam",cursive;font-size:.68rem;font-weight:700;}
.prompt{font-size:1.02rem;font-weight:700;line-height:1.5;}
.blank{color:#c0392b;border-bottom:2.5px dashed #c0392b;padding:0 .12em;}
.opts{display:grid;gap:8px;}
.opt{border:2px solid #23324d;border-radius:8px;background:#fbf7ec;padding:9px 12px;font-weight:700;font-size:.82rem;display:flex;gap:10px;align-items:center;}
.opt .k{width:20px;height:20px;border:2px solid rgba(35,50,77,.5);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.62rem;color:#4c5f7d;flex:none;}
.opt.correct{border-color:#2f7a45;background:rgba(47,122,69,.10);}
.badge{display:inline-block;margin-left:6px;font-size:.6rem;font-weight:800;color:#2f7a45;border:1px solid #2f7a45;border-radius:4px;padding:0 4px;vertical-align:middle;}
</style>
</head>
<body>
<h1>Possessiv — 21 Fragen (Final)</h1>
<p class="note">Exakt wie im Arbeitsblatt — ohne englische Übersetzung · korrekte Antwort grün</p>
<div class="wrap" id="wrap"></div>
<script>
const W=[
{q:"Ist das ______ Tasche?",o:"du",c:"deine",opts:["deine","meine","seine","ihre"]},
{q:"Das ist ______ Hund.",o:"er",c:"sein",opts:["sein","mein","dein","ihr"]},
{q:"______ Mutter hat angerufen.",o:"du",c:"Deine",opts:["Deine","Meine","Seine","Ihre"]},
{q:"______ Lieblingsfarbe ist blau.",o:"ich",c:"Meine",opts:["Meine","Deine","Seine","Ihre"]},
{q:"______ Flug geht um halb 9 Uhr.",o:"wir",c:"unser",opts:["unser","mein","dein","euer"]},
{q:"______ Haus ist groß.",o:"er",c:"sein",opts:["sein","mein","dein","unser"]},
{q:"Ich mache ______ Zimmer sauber.",o:"ich",c:"mein",opts:["mein","dein","sein","unser"]},
{q:"______ Vogel ist weggeflogen.",o:"sie",c:"ihr",opts:["ihr","sein","mein","dein"]},
{q:"Denkt an ______ Hausaufgaben!",o:"ihr",c:"eure",opts:["eure","meine","deine","unsere"]},
{q:"Das ist ______ Garten.",o:"wir",c:"unser",opts:["unser","mein","dein","sein"]},
{q:"Das sind ______ Kinder.",o:"er",c:"seine",opts:["seine","meine","deine","unsere"]},
{q:"______ Füße tun weh!",o:"ich",c:"Meine",opts:["Meine","Deine","Seine","Unsere"]},
{q:"Hast du ______ Hände gewaschen?",o:"du",c:"deine",opts:["deine","meine","seine","ihre"]},
{q:"Das sind ______ Bücher.",o:"wir",c:"unsere",opts:["unsere","meine","deine","eure"]},
{q:"Das ist ______ Schwester.",o:"ich",c:"meine",opts:["meine","deine","seine","ihre"]},
{q:"Das ist ______ Bruder.",o:"ich",c:"mein",opts:["mein","dein","sein","unser"]},
{q:"______ Katze heißt Toto.",o:"sie",c:"Ihre",opts:["Ihre","Meine","Deine","Seine"]},
{q:"______ Telefon klingelt.",o:"du",c:"Dein",opts:["Dein","Mein","Sein","Unser"]},
{q:"______ Mutter arbeitet im Augenblick.",o:"sie (pl.)",c:"Ihre",opts:["Ihre","Meine","Deine","Seine"]},
{q:"Das ist ______ größter Wunsch.",o:"sie",c:"ihr",opts:["ihr","mein","dein","sein"]},
{q:"Das Tier krabbelt in ______ Höhle.",o:"es",c:"seine",opts:["seine","meine","deine","ihre"]},
];
const wrap=document.getElementById('wrap');
W.forEach((item,i)=>{
  const prompt=item.q.replace('______','<span class="blank">______</span>');
  const opts=item.opts.map((o,j)=>{
    const ok=o===item.c;
    return `<div class="opt ${ok?'correct':''}"><span class="k">${String.fromCharCode(65+j)}</span>${o}${ok?' <span class="badge">✓</span>':''}</div>`
  }).join('');
  wrap.insertAdjacentHTML('beforeend',
    `<div class="card"><span class="kicker">Nominativ · ${item.o}</span><p class="prompt">${prompt}</p><div class="opts">${opts}</div></div>`);
});
</script>
</body>
</html>
