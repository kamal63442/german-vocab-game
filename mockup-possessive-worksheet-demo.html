<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Possessiv — 21 Worksheet Fragen (Demo)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;padding:26px 14px;background:#e8dfc4;font-family:"Nunito",system-ui,sans-serif;color:#23324d;
  background-image:linear-gradient(rgba(120,148,191,.35) 1px,transparent 1px);background-size:100% 21px;}
h1{font-family:"Kalam",cursive;font-size:1.7rem;text-align:center;margin:0;transform:rotate(-1deg);}
.note{text-align:center;font-size:.76rem;font-weight:600;color:#4c5f7d;margin:4px 0 14px;}
.wrap{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}
.card{border:2px solid #23324d;border-radius:8px;background:#fbf7ec;box-shadow:3px 3px 0 rgba(35,50,77,.14);padding:13px 15px;display:grid;gap:10px;}
.kicker{color:#c0392b;font-family:"Kalam",cursive;font-size:.68rem;font-weight:700;}
.prompt{font-size:1.02rem;font-weight:700;line-height:1.5;}
.blank{color:#c0392b;border-bottom:2.5px dashed #c0392b;padding:0 .12em;}
.opts{display:grid;gap:8px;}
.opt{border:2px solid #23324d;border-radius:8px;background:#fbf7ec;padding:9px 12px;font-weight:700;font-size:.82rem;display:flex;gap:10px;align-items:center;}
.opt .k{width:20px;height:20px;border:2px solid rgba(35,50,77,.5);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.62rem;color:#4c5f7d;flex:none;}
.opt.correct{border-color:#2f7a45;background:rgba(47,122,69,.10);}
.badge{display:inline-block;margin-left:6px;font-size:.6rem;font-weight:800;color:#2f7a45;border:1px solid #2f7a45;border-radius:4px;padding:0 4px;vertical-align:middle;}
</style>
</head>
<body>
<h1>Possessiv — 21 Fragen</h1>
<p class="note">So sieht jede Frage im Spiel aus · korrekte Antwort grün markiert</p>
<div class="wrap" id="wrap"></div>
<script>
const Q=[
{n:1,q:"Ist das ______ Tasche?",owner:"du",gender:"f",correct:"deine",opts:["deine","meine","seine","ihre"],verb:"Tasche (f) — bag"},
{n:2,q:"Das ist ______ Hund.",owner:"er",gender:"m",correct:"sein",opts:["sein","mein","dein","ihr"],verb:"Hund (m) — dog"},
{n:3,q:"______ Mutter hat angerufen.",owner:"du",gender:"f",correct:"Deine",opts:["Deine","Meine","Seine","Ihre"],verb:"Mutter (f)"},
{n:4,q:"______ Lieblingsfarbe ist blau.",owner:"ich",gender:"f",correct:"Meine",opts:["Meine","Deine","Seine","Ihre"],verb:"Farbe (f)"},
{n:5,q:"______ Flug geht um halb 9 Uhr.",owner:"wir",gender:"m",correct:"unser",opts:["unser","mein","dein","euer"],verb:"Flug (m)"},
{n:6,q:"______ Haus ist groß.",owner:"er",gender:"n",correct:"sein",opts:["sein","mein","dein","unser"],verb:"Haus (n)"},
{n:7,q:"Ich mache ______ Zimmer sauber.",owner:"ich",gender:"n",correct:"mein",opts:["mein","dein","sein","unser"],verb:"Zimmer (n)"},
{n:8,q:"______ Vogel ist weggeflogen.",owner:"sie",gender:"m",correct:"ihr",opts:["ihr","sein","mein","dein"],verb:"Vogel (m) — bird"},
{n:9,q:"Denkt an ______ Hausaufgaben!",owner:"ihr",gender:"pl",correct:"eure",opts:["eure","meine","deine","unsere"],verb:"Hausaufgaben (pl)"},
{n:10,q:"Das ist ______ Garten.",owner:"wir",gender:"m",correct:"unser",opts:["unser","mein","dein","sein"],verb:"Garten (m) — garden"},
{n:11,q:"Das sind ______ Kinder.",owner:"er",gender:"pl",correct:"seine",opts:["seine","meine","deine","unsere"],verb:"Kinder (pl) — children"},
{n:12,q:"______ Füße tun weh!",owner:"ich",gender:"pl",correct:"Meine",opts:["Meine","Deine","Seine","Unsere"],verb:"Füße (pl) — feet"},
{n:13,q:"Hast du ______ Hände gewaschen?",owner:"du",gender:"pl",correct:"deine",opts:["deine","meine","seine","ihre"],verb:"Hände (pl) — hands"},
{n:14,q:"Das sind ______ Bücher.",owner:"wir",gender:"pl",correct:"unsere",opts:["unsere","meine","deine","eure"],verb:"Bücher (pl) — books"},
{n:15,q:"Das ist ______ Schwester.",owner:"ich",gender:"f",correct:"meine",opts:["meine","deine","seine","ihre"],verb:"Schwester (f) — sister"},
{n:16,q:"Das ist ______ Bruder.",owner:"ich",gender:"m",correct:"mein",opts:["mein","dein","sein","unser"],verb:"Bruder (m) — brother"},
{n:17,q:"______ Katze heißt Toto.",owner:"sie",gender:"f",correct:"Ihre",opts:["Ihre","Meine","Deine","Seine"],verb:"Katze (f) — cat"},
{n:18,q:"______ Telefon klingelt.",owner:"du",gender:"n",correct:"Dein",opts:["Dein","Mein","Sein","Unser"],verb:"Telefon (n) — phone"},
{n:19,q:"______ Mutter arbeitet im Augenblick.",owner:"sie (pl.)",gender:"f",correct:"Ihre",opts:["Ihre","Meine","Deine","Seine"],verb:"Mutter (f) — they"},
{n:20,q:"Das ist ______ größter Wunsch.",owner:"sie",gender:"m",correct:"ihr",opts:["ihr","mein","dein","sein"],verb:"Wunsch (m) — wish"},
{n:21,q:"Das Tier krabbelt in ______ Höhle.",owner:"es",gender:"f",correct:"seine",opts:["seine","meine","deine","ihre"],verb:"Höhle (f) — cave"},
];
const wrap=document.getElementById('wrap');
Q.forEach((item,i)=>{
  const prompt=item.q.replace('______','<span class="blank">______</span>');
  const opts=item.opts.map((o,j)=>{
    const correct=o===item.correct;
    return `<div class="opt ${correct?'correct':''}"><span class="k">${String.fromCharCode(65+j)}</span>${o}${correct?' <span class="badge">✓</span>':''}</div>`
  }).join('');
  wrap.insertAdjacentHTML('beforeend',
    `<div class="card">
      <span class="kicker">Nominativ · ${item.owner} · ${item.verb}</span>
      <p class="prompt">${prompt}</p>
      <div class="opts">${opts}</div>
    </div>`);
});
</script>
</body>
</html>
