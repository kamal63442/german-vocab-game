<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wort→Zahl — Display Options</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;padding:26px 14px;background:#e8dfc4;font-family:"Nunito",system-ui,sans-serif;color:#23324d;
  background-image:linear-gradient(rgba(120,148,191,.35) 1px,transparent 1px);background-size:100% 21px;}
.wrap{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
h1{font-family:"Kalam",cursive;font-size:1.6rem;text-align:center;margin:0;transform:rotate(-1deg);}
.note{text-align:center;font-size:.72rem;font-weight:600;color:#4c5f7d;margin:4px 0 8px;}
.frame{border:2px solid #23324d;border-radius:12px;background:#f3ecd9;box-shadow:4px 4px 0 rgba(35,50,77,.16);padding:10px 12px;}
.qcard{border:2px solid #23324d;border-radius:8px;background:#fbf7ec;padding:13px 15px;display:grid;gap:10px;}
.kicker{color:#c0392b;font-family:"Kalam",cursive;font-size:.68rem;font-weight:700;}
.opts{display:grid;gap:8px;}
.opt{border:2px solid #23324d;border-radius:8px;background:#fbf7ec;padding:8px 12px;font-weight:700;font-size:.78rem;display:flex;gap:10px;align-items:center;}
.opt .kk{width:18px;height:18px;border:2px solid rgba(35,50,77,.5);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.58rem;color:#4c5f7d;flex:none;}
.lbl{text-align:center;font-size:.63rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#4c5f7d;margin:6px auto 2px;line-height:1.5;}
.cword{font-family:"Kalam",cursive;font-weight:700;line-height:1.1;transform:rotate(-1deg);}
</style>
</head>
<body>
<div class="wrap">
<h1>sechshundert­vierundsiebzig</h1>
<p class="note">Wort → Zahl — 4 Anzeige-Optionen · gleiches Wort</p>
</div>
<script>
const word="sechshundertvvierundsiebzig".replace('vvier','vier'); // fix typo above: sechshundertvierundsiebzig
const w="sechshundertvierundsiebzig";
const opts='<div class="opts"><div class="opt"><span class="kk">A</span>674</div><div class="opt"><span class="kk">B</span>764</div><div class="opt"><span class="kk">C</span>647</div><div class="opt"><span class="kk">D</span>746</div></div>';
const designs=[
{
title:"A · Aktuell — zwei Zeilen",
label:"sechshundert- / vierundsiebzig · beide gleich groß",
html:`<div class="cword" style="font-size:clamp(1.5rem,3.4vw+2vh,2.35rem);">sechshundert-<br>vierundsiebzig</div>`
},
{
title:"B · Eine Zeile — auto-schrumpf",
label:"einzeilig · schrumpft bis es passt (~1.1rem bei 27 Zeichen)",
html:`<div class="cword" style="font-size:clamp(1.15rem,2.6vw+1.5vh,1.8rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">sechshundertvierundsiebzig</div>`
},
{
title:"C · Chunk-Farben",
label:"Hunderter hell · Rest fett mit Gold-Unterstrich",
html:`<div class="cword" style="font-size:clamp(1.5rem,3.4vw+2vh,2.35rem);">`+
`<span style="color:#7a8aa5;">sechshundert</span><span style="color:#f0b429;">·</span><br>`+
`<span style="border-bottom:3px solid #f0b429;">vierundsiebzig</span></div>`
},
{
title:"D · Pill-Scroll",
label:"Pille mit Rand · horizontal wischbar",
html:`<div style="display:flex;justify-content:center;"><span class="cword" style="border:2.5px dashed #23324d;background:#fff3b0;border-radius:999px;padding:6px 18px;white-space:nowrap;overflow-x:auto;max-width:100%;font-size:clamp(1.15rem,2.6vw+1.6vh,1.7rem);">sechshundertvierundsiebzig</span></div>`
}
];
const wrap=document.querySelector('.wrap');
designs.forEach((d,i)=>{
  wrap.insertAdjacentHTML('beforeend',`
    <div class="frame"><div class="qcard"><span class="kicker">Wort → Zahl</span>${d.html}${opts}</div></div>
    <div class="lbl">${d.title}<br><span style="text-transform:none;letter-spacing:0;">${d.label}</span></div>
  `);
});
</script>
</body>
</html>
