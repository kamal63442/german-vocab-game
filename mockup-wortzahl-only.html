<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wort → Zahl — Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;padding:28px 14px;background:#e8dfc4;font-family:"Nunito",system-ui,sans-serif;color:#23324d;
  background-image:linear-gradient(rgba(120,148,191,.35) 1px,transparent 1px);background-size:100% 21px;}
.wrap{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}
h1{font-family:"Kalam",cursive;font-size:1.6rem;text-align:center;margin:0;transform:rotate(-1deg);}
.note{text-align:center;font-size:.74rem;font-weight:600;color:#4c5f7d;margin:4px 0 6px;}
.frame{border:2px solid #23324d;border-radius:12px;background:#f3ecd9;box-shadow:4px 4px 0 rgba(35,50,77,.16);padding:12px;}
.qcard{border:2px solid #23324d;border-radius:8px;background:#fbf7ec;padding:13px 15px;display:grid;gap:10px;}
.kicker{color:#c0392b;font-family:"Kalam",cursive;font-size:.68rem;font-weight:700;}
.pill{border:2.5px dashed #23324d;background:#fff3b0;border-radius:999px;padding:6px 18px;white-space:nowrap;overflow-x:auto;max-width:100%;font-family:"Kalam",cursive;font-weight:700;font-size:clamp(1.15rem,2.6vw+1.6vh,1.7rem);display:inline-block;}
.opts{display:grid;gap:8px;}
.opt{border:2px solid #23324d;border-radius:8px;background:#fbf7ec;padding:8px 12px;font-weight:700;font-size:.78rem;display:flex;gap:10px;align-items:center;}
.opt .k{width:18px;height:18px;border:2px solid rgba(35,50,77,.5);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.58rem;color:#4c5f7d;flex:none;}
</style>
</head>
<body>
<div class="wrap">
<h1>Wort → Zahl</h1>
<p class="note">Lange Wörter in der Pille — alle zentriert, bei Bedarf sc rollbar</p>
</div>
<script>
const words=["siebenhundertelf","achthundertsiebenundvierzig","dreihundertsiebenundzwanzig","neunhundertdreiundvierzig","fünfhundertneunundneunzig","zweihunderteinundzwanzig","sechshundertvierundsiebzig"];
const wrap=document.querySelector('.wrap');
words.forEach((w,i)=>{
  wrap.insertAdjacentHTML('beforeend',`
    <div class="frame"><div class="qcard">
      <span class="kicker">Wort → Zahl</span>
      <div style="display:flex;justify-content:center;margin:4px 0;"><span class="pill">${w}</span></div>
      <div class="opts">
        <div class="opt"><span class="k">A</span>327</div>
        <div class="opt"><span class="k">B</span>${100+i*11}</div>
        <div class="opt"><span class="k">C</span>${200+i*13}</div>
        <div class="opt"><span class="k">D</span>${300+i*7}</div>
      </div>
    </div></div>
  `);
});
</script>
</body>
</html>
